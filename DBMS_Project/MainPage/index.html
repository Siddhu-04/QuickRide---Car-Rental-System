<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRide Car Rentals</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <!-- Navbar -->
    <header>
        <div class="logo">QUICK<span>RIDE</span></div>
        <nav>
            <ul>
                <li><a href="#">Blog</a></li>
                <li><button class="login-btn"><a href="login.html"></a>Login</button></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>SERVICES ACROSS ALL CITIES</h1>
        <div class="booking-box">
            <div class="trip-type">
                <button class="active">ROUND TRIP</button>
                <button>ONE WAY</button>
                <button>LOCAL</button>
                <button>AIRPORT</button>
            </div>
            <div class="input-group">
                <label>From</label>
                <input type="text" value="Gandhinagar, Gujarat">
            </div>
            <div class="input-group">
                <label>To</label>
                <input type="text" placeholder="Enter Drop City">
            </div>
            <div class="input-group">
                <label>Pick Up Date</label>
                <input type="date">
            </div>
            <div class="input-group">
                <label>Return Date</label>
                <input type="date">
            </div>
            <div class="input-group">
                <label>Pick Up Time</label>
                <input type="time">
            </div>
            <button class="explore-btn">EXPLORE CABS</button>
        </div>
    </section>

    <!-- Features Section -->
    <section class="features">
        <div class="feature">
            <img src="car-icon.png" alt="Car Rental">
            <p>Car Rental Expert</p>
        </div>
        <div class="feature">
            <img src="city-icon.png" alt="Cities">
            <p>Cities across India</p>
        </div>
        <div class="feature">
            <img src="driver-icon.png" alt="Drivers">
            <p>Driver Partners</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
